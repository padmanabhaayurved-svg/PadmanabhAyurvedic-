<!-- CART & CHECKOUT PAGE -->
<div class="cart-page">
  <div class="container" id="cart-container">
    <!-- Rendered via JS -->
  </div>
</div>

<script>
const SHIPPING_CHARGE = 70;

document.addEventListener('page:cart', renderCartPage);
document.addEventListener('cart:updated', () => {
  if (window._currentRoute === 'cart') renderCartPage();
});

function renderCartPage() {
  const container = document.getElementById('cart-container');
  if (!container) return;

  const cart = Store.getCart();
  if (cart.length === 0) {
    container.innerHTML = `
      <div class="text-center" style="padding:100px 20px">
        <div style="font-size:4rem;margin-bottom:24px;opacity:0.5">🛒</div>
        <h2 style="margin-bottom:16px" data-i18n="cart.empty">Your cart is empty.</h2>
        <button class="btn btn-primary" onclick="navigate('catalog')" data-i18n="cart.empty.cta">Start Shopping</button>
      </div>
    `;
    applyStrings();
    return;
  }

  const subtotal = Store.getCartTotal();
  const total    = subtotal + SHIPPING_CHARGE;
  const lang     = localStorage.getItem('pa_lang') || 'en';

  container.innerHTML = `
    <div class="checkout-page-wrap">
      <!-- Left: Form -->
      <div class="checkout-form-col">
        <div class="checkout-header">
          <button class="checkout-back-btn" onclick="navigate('catalog')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
            Continue Shopping
          </button>
          <h1 class="checkout-title">Checkout</h1>
        </div>

        <!-- Cart Items Mini-Summary -->
        <div class="checkout-items-preview">
          <div class="checkout-section-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            Your Items (${cart.length})
          </div>
          <div class="checkout-items-list">
            ${cart.map(item => {
              const name = lang === 'hi' ? (item.nameHi || item.name) : lang === 'mr' ? (item.nameMr || item.name) : item.name;
              return `
              <div class="checkout-item-row">
                <div class="checkout-item-img">
                  <img src="${Store.convertDriveLink(item.image)}" alt="${name}" loading="lazy"/>
                  <span class="checkout-item-qty-badge">${item.qty}</span>
                </div>
                <div class="checkout-item-info">
                  <div class="checkout-item-name">${name}</div>
                  <div class="checkout-item-price">${Store.formatPrice(item.price)} × ${item.qty}</div>
                </div>
                <div class="checkout-item-total">${Store.formatPrice(item.price * item.qty)}</div>
                <div style="display:flex;align-items:center;gap:8px;margin-left:8px">
                  <div class="qty-control" style="transform:scale(0.85)">
                    <button class="qty-btn" onclick="Store.updateQty('${item.id}', ${item.qty - 1})">−</button>
                    <span class="qty-value">${item.qty}</span>
                    <button class="qty-btn" onclick="Store.updateQty('${item.id}', ${item.qty + 1})">+</button>
                  </div>
                  <button onclick="Store.removeFromCart('${item.id}')" style="background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem;padding:4px" title="Remove">✕</button>
                </div>
              </div>`;
            }).join('')}
          </div>
        </div>

        <!-- Delivery Form -->
        <div class="checkout-form-section">
          <div class="checkout-section-label">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            Delivery Details
          </div>
          <form id="checkout-form">
            <div class="co-form-grid">
              <div class="form-group">
                <label class="form-label">Full Name *</label>
                <input type="text" class="form-input co-input" id="co-name" placeholder="Your full name" required/>
              </div>
              <div class="form-group">
                <label class="form-label">Phone Number *</label>
                <input type="tel" class="form-input co-input" id="co-phone" placeholder="10-digit mobile number" required pattern="[0-9]{10}"/>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-input co-input" id="co-email" placeholder="your@email.com"/>
            </div>
            <div class="form-group">
              <label class="form-label">Street Address *</label>
              <input type="text" class="form-input co-input" id="co-address" placeholder="House no., Street, Colony" required/>
            </div>
            <div class="co-form-grid">
              <div class="form-group">
                <label class="form-label">City *</label>
                <input type="text" class="form-input co-input" id="co-city" placeholder="City" required/>
              </div>
              <div class="form-group">
                <label class="form-label">State *</label>
                <input type="text" class="form-input co-input" id="co-state" placeholder="State" required/>
              </div>
            </div>
            <div class="form-group" style="max-width:180px">
              <label class="form-label">Pincode *</label>
              <input type="text" class="form-input co-input" id="co-pin" placeholder="6-digit pincode" required pattern="[0-9]{6}" maxlength="6"/>
            </div>

            <!-- COD Notice -->
            <div class="cod-notice">
              <div class="cod-notice-icon">📦</div>
              <div>
                <div style="font-weight:600;color:var(--text-primary);margin-bottom:2px">Cash on Delivery</div>
                <div style="font-size:0.82rem;color:var(--text-secondary)">Pay when your order arrives at your doorstep. Safe & trusted.</div>
              </div>
            </div>

            <!-- Place Order Button -->
            <button type="submit" class="btn btn-primary btn-lg place-order-btn" id="place-order-btn">
              <span id="place-order-btn-icon">📦</span>
              <span id="place-order-btn-text">Place Order · ${Store.formatPrice(total)}</span>
            </button>
            <p style="text-align:center;font-size:0.8rem;color:var(--text-muted);margin-top:12px">
              🔒 Your information is safe & secure
            </p>
          </form>
        </div>
      </div>

      <!-- Right: Order Summary -->
      <div class="checkout-summary-col">
        <div class="order-summary-card sticky-summary">
          <div class="order-summary-title">Order Summary</div>
          <div class="summary-items-list">
            ${cart.map(item => {
              const name = lang === 'hi' ? (item.nameHi || item.name) : lang === 'mr' ? (item.nameMr || item.name) : item.name;
              return `
              <div class="summary-item-row">
                <div class="summary-item-img">
                  <img src="${Store.convertDriveLink(item.image)}" alt="${name}" loading="lazy"/>
                </div>
                <div style="flex:1;min-width:0">
                  <div style="font-size:0.85rem;color:var(--text-primary);line-height:1.3;margin-bottom:2px">${name}</div>
                  <div style="font-size:0.75rem;color:var(--text-muted)">Qty: ${item.qty}</div>
                </div>
                <div style="font-size:0.9rem;font-weight:600;color:var(--text-primary);white-space:nowrap">${Store.formatPrice(item.price * item.qty)}</div>
              </div>`;
            }).join('')}
          </div>
          <div class="summary-divider"></div>
          <div class="order-summary-row">
            <span>Subtotal</span>
            <span>${Store.formatPrice(subtotal)}</span>
          </div>
          <div class="order-summary-row">
            <span>Shipping</span>
            <span>${Store.formatPrice(SHIPPING_CHARGE)}</span>
          </div>
          <div class="summary-divider"></div>
          <div class="order-summary-row total">
            <span>Total</span>
            <span id="summary-total">${Store.formatPrice(total)}</span>
          </div>
          <div class="summary-trust-badges">
            <div class="trust-badge-mini">✓ Authentic Products</div>
            <div class="trust-badge-mini">✓ AYUSH Certified</div>
            <div class="trust-badge-mini">✓ Easy Returns</div>
          </div>
        </div>
      </div>
    </div>
  `;

  applyStrings();

  // Handle Checkout
  const form = document.getElementById('checkout-form');
  if (form) {
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const btn     = document.getElementById('place-order-btn');
      const btnText = document.getElementById('place-order-btn-text');
      const btnIcon = document.getElementById('place-order-btn-icon');

      btn.disabled  = true;
      btnIcon.textContent = '⏳';
      btnText.textContent = 'Placing Your Order…';

      const address = {
        name:    document.getElementById('co-name').value.trim(),
        phone:   document.getElementById('co-phone').value.trim(),
        email:   document.getElementById('co-email').value.trim(),
        address: document.getElementById('co-address').value.trim(),
        city:    document.getElementById('co-city').value.trim(),
        state:   document.getElementById('co-state').value.trim(),
        pincode: document.getElementById('co-pin').value.trim()
      };

      const session = PhoneAuth.getUser();
      const orderPayload = {
        ...Store.buildOrderPayload({ address, userId: session?.uid }),
        payment:    'COD',
        paymentId:  'COD_' + Date.now(),
        shipping:   SHIPPING_CHARGE,
        total:      Store.getCartTotal() + SHIPPING_CHARGE
      };

      try {
        const orderId = await createOrder(orderPayload);
        await processOrderAfterCreation(orderId, address, orderPayload, { paymentId: orderPayload.paymentId });
      } catch (err) {
        console.error('Order Error:', err);
        showToast('Order creation failed. Please try again.', 'error');
        btn.disabled  = false;
        btnIcon.textContent = '📦';
        btnText.textContent = `Place Order · ${Store.formatPrice(Store.getCartTotal() + SHIPPING_CHARGE)}`;
      }
    });
  }
}

// Process order after creation (kept for compatibility)
async function processOrderAfterCreation(orderId, address, orderPayload, res) {
  const localOrders = JSON.parse(localStorage.getItem('pa_orders') || '[]');
  const localOrder = {
    id: orderId,
    userId: orderPayload.userId,
    customerName: address.name,
    customerPhone: address.phone,
    email: address.email,
    address: address,
    items: orderPayload.items,
    subtotal: orderPayload.subtotal,
    shipping: SHIPPING_CHARGE,
    total: orderPayload.total,
    payment: 'COD',
    paymentId: res.paymentId,
    status: 'processing',
    createdAt: new Date().toISOString()
  };
  localOrders.push(localOrder);
  localStorage.setItem('pa_orders', JSON.stringify(localOrders));

  Store.clearCart();
  showOrderSuccess(orderId);
}

function showOrderSuccess(orderId) {
  const container = document.getElementById('cart-container');
  const orderNum  = orderId?.slice(-6)?.toUpperCase() || '—';
  const now       = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });

  container.innerHTML = `
    <div class="order-success">
      <div class="order-success-checkmark">✓</div>
      <h1 class="mb-16">Order Placed!</h1>
      <p style="color:var(--text-secondary);margin-bottom:32px;max-width:440px;margin-left:auto;margin-right:auto;line-height:1.7">
        Thank you for your order! We'll call or WhatsApp you to confirm. Your Ayurvedic products will be on their way soon.
      </p>
      <div class="order-success-card">
        <div class="order-detail-row">
          <span class="order-detail-label">Order #</span>
          <span class="order-detail-value gold">${orderNum}</span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">Date</span>
          <span class="order-detail-value">${now}</span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">Payment</span>
          <span class="order-detail-value">Cash on Delivery (COD)</span>
        </div>
        <div class="order-detail-row">
          <span class="order-detail-label">Shipping</span>
          <span class="order-detail-value">₹70 (collected on delivery)</span>
        </div>
      </div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="navigate('home')">Continue Shopping</button>
        <button class="btn btn-outline" onclick="openUserDrawer()">View My Orders</button>
      </div>
    </div>
  `;
  applyStrings();
}
</script>
