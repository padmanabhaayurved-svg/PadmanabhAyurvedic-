<div class="cart-page" id="cart-root">
  <div class="container" id="cart-container"></div>
</div>

<script>
const SHIPPING_CHARGE = 70;

document.addEventListener('page:cart', renderCartPage);
document.addEventListener('cart:updated', () => {
  if (window._currentRoute === 'cart') renderCartPage();
});

function renderCartPage() {
  const container = document.getElementById('cart-container');
  if (!container) return;

  const cart = Store.getCart();

  if (cart.length === 0) {
    container.innerHTML = `
      <div class="co-empty">
        <div class="co-empty-art">🛒</div>
        <h2 style="font-family:var(--font-serif)">Your cart is empty</h2>
        <p style="color:var(--text-muted);max-width:320px;line-height:1.6">Discover our premium Ayurvedic products and add something wonderful.</p>
        <button class="btn btn-primary btn-lg" onclick="navigate('catalog')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          Browse Products
        </button>
      </div>`;
    applyStrings();
    return;
  }

  const lang     = localStorage.getItem('pa_lang') || 'en';
  const subtotal = Store.getCartTotal();
  const total    = subtotal + SHIPPING_CHARGE;

  container.innerHTML = `
    <!-- Back + Progress -->
    <div class="co-top-nav" style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px">
      <button class="co-back-btn" onclick="navigate('catalog')" style="display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:0.85rem;padding:0;transition:color 0.2s" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--text-muted)'">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Continue Shopping
      </button>
      <div style="display:flex;align-items:center;gap:0">
        <div class="co-step done">
          <div class="co-step-circle">✓</div>
          <div class="co-step-label">Cart</div>
        </div>
        <div class="co-step-line done"></div>
        <div class="co-step active">
          <div class="co-step-circle">2</div>
          <div class="co-step-label">Details</div>
        </div>
        <div class="co-step-line"></div>
        <div class="co-step">
          <div class="co-step-circle">3</div>
          <div class="co-step-label">Confirm</div>
        </div>
      </div>
    </div>

    <div class="co-wrap" style="padding:0;max-width:100%">
      <!-- LEFT -->
      <div class="co-left">
        <!-- Items -->
        <div class="co-card active-card">
          <div class="co-card-header">
            <div class="co-card-header-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            </div>
            <span class="co-card-title">Your Items</span>
            <span class="co-card-badge">${cart.length} item${cart.length > 1 ? 's' : ''}</span>
          </div>
          <div class="co-items-list" id="co-items-list">
            ${cart.map(item => buildItemRow(item, lang)).join('')}
          </div>
        </div>

        <!-- Delivery Form -->
        <div class="co-card active-card">
          <div class="co-card-header">
            <div class="co-card-header-icon">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            </div>
            <span class="co-card-title">Delivery Details</span>
          </div>
          <form id="co-form" novalidate>
            <div class="co-form-body">
              <div class="co-form-row">
                <div class="co-form-group">
                  <label class="co-label">Full Name <span>*</span></label>
                  <input type="text" class="co-input" id="co-name" placeholder="Raj Kumar" required autocomplete="name"/>
                </div>

function buildItemRow(item, lang) {
  const name = lang === 'hi' ? (item.nameHi || item.name) : lang === 'mr' ? (item.nameMr || item.name) : item.name;
  return `
  <div class="co-item" id="co-item-${item.id}">
    <div class="co-item-img">
      <img src="${Store.convertDriveLink(item.image)}" alt="${name}" loading="lazy"/>
      <div class="co-item-qty-pill">${item.qty}</div>
    </div>
    <div class="co-item-info">
      <div class="co-item-name">${name}</div>
      <div class="co-item-meta">${Store.formatPrice(item.price)} per unit</div>
    </div>
    <div class="co-item-controls">
      <div class="co-qty-ctrl">
        <button class="co-qty-btn" onclick="coUpdateQty('${item.id}', ${item.qty - 1})">−</button>
        <span class="co-qty-val">${item.qty}</span>
        <button class="co-qty-btn" onclick="coUpdateQty('${item.id}', ${item.qty + 1})">+</button>
      </div>
      <div class="co-item-price">${Store.formatPrice(item.price * item.qty)}</div>
      <button class="co-remove-btn" onclick="coRemoveItem('${item.id}')" title="Remove">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>
  </div>`;
}

function coUpdateQty(id, newQty) {
  Store.updateQty(id, newQty);
  renderCartPage();
}
function coRemoveItem(id) {
  const el = document.getElementById('co-item-' + id);
  if (el) {
    el.style.transition = 'all 0.25s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateX(20px)';
    setTimeout(() => { Store.removeFromCart(id); renderCartPage(); }, 250);
  } else {
    Store.removeFromCart(id);
    renderCartPage();
  }
}

function setupInputValidation() {
  const fields = {
    'co-name':    v => v.trim().length >= 2,
    'co-phone':   v => /^[0-9]{10}$/.test(v.trim()),
    'co-address': v => v.trim().length >= 5,
    'co-city':    v => v.trim().length >= 2,
    'co-state':   v => v.trim().length >= 2,
    'co-pin':     v => /^[0-9]{6}$/.test(v.trim()),
  };
  Object.keys(fields).forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    el.addEventListener('blur', () => {
      const valid = fields[id](el.value);
      el.classList.toggle('valid', valid);
      el.classList.toggle('error', !valid && el.value.length > 0);
    });
    el.addEventListener('input', () => {
      if (el.classList.contains('error') && fields[id](el.value)) {
        el.classList.remove('error');
        el.classList.add('valid');
      }
    });
  });
}

window.submitCheckout = async function() {
  const btn  = document.getElementById('co-place-btn');
  const icon = document.getElementById('co-btn-icon');
  const text = document.getElementById('co-btn-text');

  // Validate all required fields
  const required = ['co-name', 'co-phone', 'co-address', 'co-city', 'co-state', 'co-pin'];
  const validators = {
    'co-name':    v => v.trim().length >= 2,
    'co-phone':   v => /^[0-9]{10}$/.test(v.trim()),
    'co-address': v => v.trim().length >= 5,
    'co-city':    v => v.trim().length >= 2,
    'co-state':   v => v.trim().length >= 2,
    'co-pin':     v => /^[0-9]{6}$/.test(v.trim()),
  };
  let hasError = false;
  required.forEach(id => {
    const el = document.getElementById(id);
    if (!el) return;
    const valid = validators[id](el.value);
    el.classList.toggle('valid', valid);
    el.classList.toggle('error', !valid);
    if (!valid && !hasError) { el.focus(); hasError = true; }
  });
  if (hasError) {
    showToast('Please fill all required fields correctly', 'error');
    return;
  }

  // Loading State
  btn.disabled = true;
  icon.textContent = '⏳';
  text.textContent = 'Placing Your Order…';

  const address = {
    name:    document.getElementById('co-name').value.trim(),
    phone:   document.getElementById('co-phone').value.trim(),
    email:   document.getElementById('co-email').value.trim(),
    address: document.getElementById('co-address').value.trim(),
    city:    document.getElementById('co-city').value.trim(),
    state:   document.getElementById('co-state').value.trim(),
    pincode: document.getElementById('co-pin').value.trim()
  };

  const session  = PhoneAuth.getUser();
  const subtotal = Store.getCartTotal();
  const orderPayload = {
    ...Store.buildOrderPayload({ address, userId: session?.uid }),
    payment:   'COD',
    paymentId: 'COD_' + Date.now(),
    shipping:  SHIPPING_CHARGE,
    total:     subtotal + SHIPPING_CHARGE
  };

  try {
    const orderId = await createOrder(orderPayload);
    // Save locally
    const localOrders = JSON.parse(localStorage.getItem('pa_orders') || '[]');
    localOrders.push({ id: orderId, ...orderPayload, address, status: 'processing', createdAt: new Date().toISOString() });
    localStorage.setItem('pa_orders', JSON.stringify(localOrders));
    Store.clearCart();
    showOrderConfirmed(orderId, address, orderPayload.total);
  } catch (err) {
    console.error('Order error:', err);
    showToast('Order failed. Please try again.', 'error');
    btn.disabled = false;
    icon.textContent = '📦';
    const t = Store.getCartTotal() + SHIPPING_CHARGE;
    text.textContent = 'Place Order · ₹' + t.toLocaleString('en-IN');
  }
};

  applyStrings();
