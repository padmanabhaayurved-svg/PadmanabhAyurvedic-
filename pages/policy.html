    refund: {

      content: `

        <p>Orders can be cancelled free of charge if they have not yet been dispatched. Once an order is shipped, cancellation is not possible.</p>

    shipping: {
      title: 'Shipping Policy',
      content: `

        <p>All orders are processed within 1-2 business days. Orders are not shipped or delivered on weekends or holidays.</p>

    }

  const selected = policies[type] || policies.privacy;
  if (titleEl) titleEl.textContent = selected.title;
  if (contentEl) contentEl.innerHTML = selected.content;
  
  window.scrollTo({ top: 0, behavior: 'smooth' });
